[project]
name = "synq-expose"
version = "0.1.0"
description = "Expose a local workspace (files, sandboxed exec, port forwards) to remote agents over SpiriSynq"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "SpiriSynq>=0.3.0",
    "typer>=0.24.1",
    "rich>=14.3.3",
    "loguru>=0.7.3",
    "pathspec>=0.12.1",
    "json5>=0.17.3",
]

[project.scripts]
expose-synq = "synq_expose.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
